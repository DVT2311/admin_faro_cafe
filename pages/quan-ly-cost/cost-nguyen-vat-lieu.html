<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faro Cafe Admin - Quản Lý Cost Nguyên Vật Liệu</title>
    
    <!-- Framework Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons thư viện trực quan -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Liên kết các file CSS/JS bóc tách theo cấu trúc dự án -->
    <link rel="stylesheet" href="../../css/custom.css">
</head>
<body class="bg-faro-cream text-faro-dark font-sans antialiased h-screen flex flex-col overflow-hidden">

    <!-- HEADER SẼ ĐƯỢC RENDER TỰ ĐỘNG VÀO ĐÂY -->
    <div id="header-container" class="flex-shrink-0"></div>

    <!-- MAIN CONTAINER -->
    <div class="flex flex-1 overflow-hidden w-full">
        
        <!-- SIDEBAR SẼ ĐƯỢC RENDER TỰ ĐỘNG VÀO ĐÂY -->
        <div id="sidebar-container" class="h-full flex-shrink-0"></div>

        <!-- DYNAMIC MAIN CONTENT (Vùng ruột thay đổi linh hoạt) -->
        <main class="flex-1 h-full overflow-y-auto p-6">
            
            <!-- Path & Action Bar -->
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between pb-6 mb-6 border-b border-[#EFEAE2]">
                <div>
                    <div class="text-xs text-[#7A431D] font-semibold mb-1 uppercase tracking-wider flex items-center gap-1">
                        <span>Quản lý Cost món Faro</span> <i class="fa-solid fa-chevron-right text-[9px] opacity-40"></i> <span>Nguyên vật liệu</span>
                    </div>
                    <h2 class="text-2xl font-bold text-[#3D2513]">Danh Mục Giá Vốn Nguyên Vật Liệu</h2>
                </div>
                <div class="flex items-center space-x-3 mt-4 sm:mt-0">
                    <!-- Nút xuất Excel -->
                    <button class="bg-[#FFFFFF] border border-[#7A431D]/30 text-[#7A431D] px-4 py-2 rounded-lg text-sm font-semibold hover:bg-[#FAF6F0] transition-all shadow-sm flex items-center space-x-2">
                        <i class="fa-solid fa-file-excel"></i>
                        <span>Xuất Excel</span>
                    </button>
                    
                    <!-- Nút Đồng Bộ Google Sheets -->
                    <button id="btn-sync-sheets" class="bg-[#FFFFFF] border border-[#7A431D]/30 text-[#7A431D] px-4 py-2 rounded-lg text-sm font-semibold hover:bg-[#FAF6F0] transition-all shadow-sm flex items-center space-x-2">
                        <i class="fa-solid fa-arrows-rotate id-sync-icon"></i>
                        <span>Đồng bộ Google Sheet</span>
                    </button>

                    <!-- Nút thêm nguyên liệu -->
                    <button class="btn-primary px-4 py-2 rounded-lg text-sm font-semibold shadow-sm flex items-center space-x-2">
                        <i class="fa-solid fa-plus"></i>
                        <span>Thêm Nguyên Liệu</span>
                    </button>
                </div>
            </div>

            <!-- TABLE CONTAINER COMPONENTS (Thẻ Card trắng nổi bật trên nền kem) -->
            <div class="bg-white rounded-xl shadow-sm border border-[#EFEAE2] overflow-hidden">
                <div class="p-4 bg-[#FAF6F0]/50 border-b border-[#EFEAE2] flex flex-col md:flex-row justify-between gap-3">
                    <div class="relative max-w-sm w-full">
                        <input type="text" oninput="handleSearch(this.value)" placeholder="Lọc mã hoặc tên nguyên liệu..." class="w-full bg-white border border-[#EFEAE2] text-sm pl-9 pr-4 py-2 rounded-lg focus:outline-none focus:border-[#7A431D]">
                        <i class="fa-solid fa-filter absolute left-3 top-3 text-[#3D2513]/40 text-xs"></i>
                    </div>
                    <div class="text-xs text-[#3D2513]/60 flex items-center gap-2">
                        <i class="fa-solid fa-circle text-emerald-500 text-[8px]"></i> Lấy dữ liệu trực tiếp từ tab công cụ dụng cụ (DM_NguyenVatLieu).
                    </div>
                </div>

                <!-- Bảng hiển thị dữ liệu thực tế -->
                <div class="overflow-x-auto w-full">
                    <table class="w-full border-collapse text-left text-sm">
                        <thead class="table-header-modern">
                            <tr>
                                <th class="p-3.5 font-semibold tracking-wide w-28 text-center text-[13px]">Mã NVL</th>
                                <th class="p-3.5 font-semibold tracking-wide text-[13px]">Tên Nguyên Vật Liệu</th>
                                <th class="p-3.5 font-semibold tracking-wide text-right w-36 text-[13px]">Giá Mua Gốc</th>
                                <th class="p-3.5 font-semibold tracking-wide text-center w-36 text-[13px]">Quy Cách Đóng Gói</th>
                                <th class="p-3.5 font-semibold tracking-wide text-center w-36 text-[13px]">Đơn Vị Định Lượng</th>
                                <th class="p-3.5 font-semibold tracking-wide text-right w-48 text-[13px]">Giá cost / 1 ĐVĐL</th>
                                <th class="p-3.5 font-semibold tracking-wide w-24 text-center text-[13px]">Hành Động</th>
                            </tr>
                        </thead>
                        <!-- Đã loại bỏ các dòng hard code cũ và thêm ID để JS tự render động -->
                        <tbody id="table-nguyen-vat-lieu-body" class="divide-y divide-[#EFEAE2] text-[#3D2513]">
                        </tbody>
                    </table>
                </div>

                <!-- Footer Pagination -->
                <div class="p-4 border-t border-[#EFEAE2] flex flex-col sm:flex-row justify-between items-center gap-3 bg-[#FAF6F0]/20">
                    <span class="text-xs text-[#3D2513]/60">Dữ liệu cập nhật tự động từ Google Sheets</span>
                    <div class="flex items-center space-x-1">
                        <button class="px-2.5 py-1 border border-[#EFEAE2] rounded text-xs bg-white text-[#3D2513]/50 hover:bg-[#FAF6F0]"><i class="fa-solid fa-chevron-left"></i></button>
                        <button class="px-3 py-1 border border-[#7A431D] bg-[#7A431D] text-white rounded text-xs font-bold">1</button>
                        <button class="px-2.5 py-1 border border-[#EFEAE2] rounded text-xs bg-white text-[#3D2513]/50 hover:bg-[#FAF6F0]"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- FOOTER SẼ ĐƯỢC RENDER TỰ ĐỘNG VÀO ĐÂY -->
    <div id="footer-container" class="flex-shrink-0"></div>

    <!-- Nhúng file xử lý đồng bộ riêng cho trang nguyên vật liệu -->
    <script src="../../js/layout-loader.js"></script>
    <script src="../../js/sync-nguyen-vat-lieu.js"></script>
    <script src="../../js/phan-trang.js"></script>
    <script src="../../js/tim-kiem.js"></script>
    <script src="../../js/main.js"></script>
</body>
</html>
